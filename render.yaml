# Render Blueprint — Backend (FastAPI + SQLite)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: duolingo-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./duolingo.db
      - key: CORS_ORIGINS
        # Comma-separated — add your Vercel URL after first deploy
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: groq/compound-mini
      - key: AI_PROVIDER
        value: groq
